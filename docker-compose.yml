# Local POC that simulates the K8s sidecar setup using Docker Compose.
# Kafka + SR + Envoy run as separate services, but the key pattern is
# preserved: SR is NOT published to the host, Envoy IS. Clients must go
# through Envoy.
#
# The `envoy.yaml` mounted here is the SAME config that lands in the
# K8s ConfigMap — just pointing at `schema-registry` DNS name instead
# of 127.0.0.1 (because in Docker Compose they're separate containers).
#
# Run:   docker compose up -d
# Test:  bash scripts/verify.sh
# Down:  docker compose down -v
services:

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    hostname: schema-registry
    depends_on: [kafka]
    # NOT published — Envoy is the only ingress, just like the K8s design.
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka:9092"

  envoy:
    image: envoyproxy/envoy:v1.31-latest
    depends_on: [schema-registry]
    ports:
      - "8080:10000"   # client
      - "9901:9901"    # admin + Prom scrape
    volumes:
      - ./envoy-config/envoy.compose.yaml:/etc/envoy/envoy.yaml:ro
